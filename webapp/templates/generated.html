{% extends "base.html" %}
{% block title %}Your CV & Cover Letter - Skills Matcher{% endblock %}
{% block content %}

<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: start;">
        <div>
            <h1 style="margin-bottom: 0;">Your Tailored Documents</h1>
            <p style="margin-top: 0.25rem;">Target role: <strong>{{ data.job_title }}</strong></p>
        </div>
        <a href="/build/{{ data.job_title }}" style="text-decoration: none;"><button class="btn-secondary btn-sm" style="margin: 0;">Edit Details</button></a>
    </div>
</div>

<!-- CV -->
<div class="card" style="margin-top: 1.5rem;">
    <div style="display: flex; justify-content: space-between; align-items: start;">
        <h1 style="font-size: 1.5rem;">CV</h1>
    </div>
    <hr style="margin: 0.75rem 0 1rem;">
    <div style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.7;">{{ cv_text }}</div>
</div>

<!-- Cover Letter -->
<div class="card" style="margin-top: 1.5rem;">
    <h1 style="font-size: 1.5rem;">Cover Letter</h1>
    <hr style="margin: 0.75rem 0 1rem;">
    <div style="white-space: pre-wrap; font-size: 0.95rem; line-height: 1.7;">{{ cover_letter_text }}</div>
</div>

<div class="card" style="margin-top: 1.5rem; text-align: center;">
    <button onclick="window.print()">Print / Save as PDF</button>
    <a href="/jobs?q={{ data.job_title }}" style="text-decoration: none;"><button style="background: #059673; margin-left: 0.5rem;">Find Real Jobs</button></a>
    <a href="/find" style="text-decoration: none;"><button style="background: #6b7280; margin-left: 0.5rem;">Start Over</button></a>
</div>

{% endblock %}
