<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skills Matcher{% endblock %}</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f7fa; color: #333; line-height: 1.6; min-height: 100vh; display: flex; flex-direction: column; }
        nav { background: #1a2332; padding: 1rem 2rem; display: flex; align-items: center; gap: 2rem; }
        nav a { color: #c8d6e5; text-decoration: none; font-weight: 500; padding: 0.5rem 1rem; border-radius: 6px; transition: background 0.2s, color 0.2s; }
        nav a:hover, nav a.active { background: #2d3a4d; color: #fff; }
        nav .brand { color: #fff; font-size: 1.25rem; font-weight: 700; margin-right: auto; }
        .container { max-width: 800px; width: 100%; margin: 2rem auto; padding: 0 1.5rem; flex: 1; }
        .card { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
        h1 { font-size: 1.75rem; margin-bottom: 0.5rem; color: #1a2332; }
        h2 { font-size: 1.2rem; margin-bottom: 0.5rem; color: #1a2332; }
        hr { border: none; border-top: 1px solid #e5e7eb; }
        p { margin-bottom: 1rem; color: #555; }
        label { display: block; font-weight: 600; margin-top: 1rem; margin-bottom: 0.25rem; color: #333; }
        input, select, textarea { width: 100%; padding: 0.6rem 0.75rem; border: 1px solid #d1d5db; border-radius: 8px; font-size: 1rem; transition: border-color 0.2s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #3b82f6; box-shadow: 0 0 0 3px rgba(59,130,246,0.15); }
        button { background: #3b82f6; color: #fff; border: none; padding: 0.7rem 1.5rem; font-size: 1rem; font-weight: 600; border-radius: 8px; cursor: pointer; transition: background 0.2s; margin-top: 1rem; }
        button:hover { background: #2563eb; }
        .result { background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 10px; padding: 1.5rem; margin-top: 1.5rem; }
        .result h2 { color: #166534; margin-bottom: 0.5rem; }
        .result .job-title { font-size: 1.5rem; color: #1a2332; font-weight: 700; margin: 0.5rem 0; }
        .result .badge { display: inline-block; background: #dcfce7; color: #166534; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; font-weight: 600; }
        .error { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .success { background: #f0fdf4; border: 1px solid #bbf7d0; color: #166534; padding: 0.75rem 1rem; border-radius: 8px; margin-bottom: 1rem; }
        .skill-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0; }
        .skill-tags span { background: #e5e7eb; padding: 0.25rem 0.75rem; border-radius: 20px; font-size: 0.875rem; }
        footer { text-align: center; padding: 1.5rem; color: #9ca3af; font-size: 0.875rem; border-top: 1px solid #e5e7eb; background: #fff; }
        .hero { text-align: center; padding: 1rem 0; }
        .hero h1 { font-size: 2rem; }
        .hero p { font-size: 1.1rem; }
        .features { display: grid; gap: 1rem; margin: 1.5rem 0; }
        .feature { background: #f9fafb; border-radius: 8px; padding: 1.25rem; }
        .feature h3 { font-size: 1.1rem; margin-bottom: 0.25rem; color: #1a2332; }
        .feature p { margin: 0; color: #666; }
        .inline-group { display: flex; gap: 0.75rem; align-items: center; }
        .inline-group input { flex: 1; }
        .steps { display: flex; justify-content: center; align-items: center; gap: 0; margin: 2rem 0; flex-wrap: wrap; }
        .step { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 140px; padding: 1rem; border-radius: 12px; transition: transform 0.2s, box-shadow 0.2s; cursor: default; }
        .step:hover { transform: translateY(-4px); box-shadow: 0 6px 20px rgba(0,0,0,0.1); }
        .step-number { width: 48px; height: 48px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.25rem; margin-bottom: 0.75rem; }
        .step h3 { font-size: 1rem; margin-bottom: 0.25rem; }
        .step p { font-size: 0.85rem; margin: 0; color: #666; }
        .step-arrow { font-size: 1.5rem; color: #9ca3af; margin: 0 0.25rem; }
        .btn-secondary { background: #6b7280; }
        .btn-secondary:hover { background: #4b5563; }
        .btn-success { background: #059669; }
        .btn-success:hover { background: #047857; }
        .btn-sm { padding: 0.5rem 1rem; font-size: 0.875rem; }
        @media (max-width: 600px) { nav { flex-wrap: wrap; gap: 0.5rem; } nav .brand { width: 100%; } .steps { flex-direction: column; } .step-arrow { transform: rotate(90deg); } }
    </style>
</head>
<body>
    <nav>
        <span class="brand">Skills Matcher</span>
        <a href="/" class="{% if active == 'home' %}active{% endif %}">Home</a>
        <a href="/find" class="{% if active == 'find' %}active{% endif %}">Find Job</a>
        <a href="/contact" class="{% if active == 'contact' %}active{% endif %}">Contact</a>
    </nav>
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    <footer>&copy; {{ now.year }} Skills Matcher. All rights reserved.</footer>
</body>
</html>
