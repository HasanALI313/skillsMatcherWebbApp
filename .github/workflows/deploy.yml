name: Deploy to Render

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - uses: actions/checkout@v4

      - name: Update env vars on Render & trigger deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_API_KEY: ${{ secrets.ADZUNA_API_KEY }}
          ADZUNA_COUNTRY: ${{ secrets.ADZUNA_COUNTRY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          echo "Updating environment variables on Render..."

          cat > /tmp/env-vars.json << 'EOF'
          [
            {"key": "ADZUNA_APP_ID", "value": "__ADZUNA_APP_ID__"},
            {"key": "ADZUNA_API_KEY", "value": "__ADZUNA_API_KEY__"},
            {"key": "ADZUNA_COUNTRY", "value": "__ADZUNA_COUNTRY__"},
            {"key": "GEMINI_API_KEY", "value": "__GEMINI_API_KEY__"},
            {"key": "GEMINI_MODEL", "value": "__GEMINI_MODEL__"}
          ]
          EOF

          sed -i "s|__ADZUNA_APP_ID__|$ADZUNA_APP_ID|g" /tmp/env-vars.json
          sed -i "s|__ADZUNA_API_KEY__|$ADZUNA_API_KEY|g" /tmp/env-vars.json
          sed -i "s|__ADZUNA_COUNTRY__|$ADZUNA_COUNTRY|g" /tmp/env-vars.json
          sed -i "s|__GEMINI_API_KEY__|$GEMINI_API_KEY|g" /tmp/env-vars.json
          sed -i "s|__GEMINI_MODEL__|$GEMINI_MODEL|g" /tmp/env-vars.json

          curl -s -X PUT "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/env-vars" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d @/tmp/env-vars.json && echo " Env vars updated."

          echo "Triggering deploy..."
          curl -s -X POST \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Content-Type: application/json" \
            -d '{"clearCache": "do_not_clear"}' && echo " Deploy triggered."
